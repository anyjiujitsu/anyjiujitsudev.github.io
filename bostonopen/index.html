<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Boston Open | ANY N.E. GRAPPLING</title>
  <!-- Reuse the existing site assets. No edits to shared files required. -->
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/layout.css" />
  <link rel="stylesheet" href="../assets/css/pills.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="stylesheet" href="../assets/css/directory.css" />
  <style>
    /* Only styles specific to the Boston Open page. */
    /* Preserve the shared page width, but pin the title to the left. */
    .siteHeaderInner--title.boston-header-row { display:flex; align-items:flex-end; justify-content:space-between; width:100%; }
    .boston-header-row > .header__title { order:0; flex:0 1 auto; margin:0; text-align:left; }
    .boston-social { order:1; display:flex; align-items:center; gap:12px; margin-left:auto; padding-bottom:3px; flex:0 0 auto; }
    .boston-social__link { display:inline-flex; align-items:center; justify-content:center; width:24px; height:24px; color:var(--icon); text-decoration:none; }
    .boston-social__link:hover { opacity:.65; }
    .boston-social__icon { width:20px; height:20px; display:block; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    .boston-filter-strip { min-height:60px; }
    .boston-content { min-height:55vh; }
    .boston-controls { display:flex; align-items:center; gap:9px; width:100%; flex-wrap:wrap; }
    .boston-picker { position:relative; min-width:225px; max-width:380px; flex:1 1 260px; }
    .boston-pill, .boston-search, .boston-submit { font:inherit; border:0; border-radius:22px; min-height:36px; }
    .boston-pill { width:100%; text-align:left; display:flex; align-items:center; justify-content:space-between; gap:10px; padding:7px 14px; background:#fff; color:#202821; cursor:pointer; }
    .boston-pill-label { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .boston-pill .boston-dot { width:8px; height:8px; flex:none; border-radius:50%; background:var(--green); display:none; }
    .boston-pill.has-selection .boston-dot { display:block; }
    .boston-menu { position:absolute; left:0; top:calc(100% + 7px); z-index:120; width:min(450px,90vw); max-height:330px; overflow:auto; background:var(--bg); border:1px solid #bbb; border-radius:10px; box-shadow:0 12px 26px #0003; color:#222; padding:8px; }
    .boston-menu[hidden] { display:none; }
    .boston-menu-row { display:flex; gap:10px; align-items:flex-start; padding:10px 7px; cursor:pointer; border-bottom:1px solid #0001; font-size:13px; }
    .boston-menu-row input { width:16px; height:16px; accent-color:var(--green); flex:none; }
    .boston-menu-actions { display:flex; justify-content:space-between; padding:5px 8px 9px; }
    .boston-menu-actions button { border:0; background:none; cursor:pointer; font:inherit; text-decoration:underline; }
    .boston-search-form { display:flex; align-items:center; gap:8px; flex:2 1 320px; min-width:220px; }
    .boston-search { box-sizing:border-box; width:100%; padding:7px 14px; background:#fff; color:#222; min-width:0; font-size:14px; }
    .boston-gym-picker { max-width:none; }
    .boston-gym-menu { width:min(480px,90vw); }
    .boston-submit { background:#fff; color:#222; cursor:pointer; padding:7px 18px; font-size:13px; font-weight:700; }
    .boston-submit:disabled { opacity:.55; cursor:wait; }
    .boston-status { min-height:20px; font-size:13px; color:var(--muted, #777); margin:12px 0; }
    .boston-results { width:100%; margin-top:12px; }
    .boston-results-head, .boston-results-row { display:grid; grid-template-columns:minmax(0,2.2fr) minmax(0,2.65fr) minmax(0,.92fr) minmax(0,.48fr) minmax(0,.6fr); gap:12px; align-items:start; }
    .boston-results-head { font-size:10px; font-weight:700; letter-spacing:.08em; padding:12px; border-bottom:2px solid #8887; }
    .boston-results-row { align-items:start; padding:14px 12px; border-bottom:1px solid #8885; font-size:13px; }
    .boston-results-row a { color:inherit; text-decoration:underline; text-underline-offset:2px; }
    .boston-results-row > span { overflow-wrap:anywhere; align-self:start; }
    .boston-results-row small { display:block; font-size:10px; opacity:.7; margin-top:3px; }
    /* Structured bracket: flat, muted belt-color bar alongside three text lines. */
    .boston-bracket { display:flex; flex-direction:row; align-items:stretch; gap:9px; min-width:0; }
    .boston-belt-bar { display:block; width:9px; flex:0 0 9px; align-self:stretch; border:0; border-radius:0; box-shadow:none; }
    .boston-bracket-text { display:flex; flex-direction:column; align-items:flex-start; gap:2px; min-width:0; }
    .boston-bracket-line { display:block; }
    .boston-empty { padding:30px 12px; color:var(--muted,#666); font-size:13px; }
    .boston-clear { background:transparent; color:#fff; border:1px solid #ffffffa8; white-space:nowrap; }
    .boston-clear:hover { background:#ffffff20; }
    @media (max-width:680px) {
      /* The open academy menu is positioned to the visible phone viewport by the script below. */
      .boston-gym-menu { position:fixed; left:8px; right:auto; width:calc(100vw - 16px); max-width:none; box-sizing:border-box; }
      .boston-controls { flex-wrap:nowrap; gap:5px; }
      .boston-picker { min-width:0; max-width:none; flex:1 1 42%; }
      .boston-search-form { min-width:0; flex:1 1 58%; gap:5px; }
      .boston-gym-picker { min-width:0; flex:1 1 auto; }
      .boston-pill { min-height:30px; border-radius:18px; padding:5px 7px; gap:4px; font-size:clamp(8px,1.9vw,11px); }
      .boston-pill .boston-dot { width:6px; height:6px; }
      .boston-submit { min-height:30px; border-radius:18px; padding:5px 9px; font-size:clamp(9px,2vw,11px); }
      .boston-results-head, .boston-results-row { grid-template-columns:minmax(0,2fr) minmax(0,2.45fr) minmax(0,.85fr) minmax(0,.45fr) minmax(0,.55fr); gap:5px; font-size:11px; padding-left:4px; padding-right:4px; }
      .boston-results-head { font-size:9px; }
      .boston-results-row small { font-size:9px; }
    }
    @media (max-width:430px) {
      .boston-controls, .boston-search-form { gap:4px; }
      .boston-pill { padding:5px 5px; font-size:8px; }
      .boston-submit { padding:5px 7px; font-size:9px; }
      .boston-filter-strip { min-height:40px; }
    }
    @media (max-width:350px) {
      .boston-pill { font-size:7px; }
      .boston-submit { padding:5px; font-size:8px; }
    }

    @media (max-width:430px) {
      .boston-social { gap:8px; padding-bottom:0; }
      .boston-social__link { width:20px; height:20px; }
      .boston-social__icon { width:17px; height:17px; }
      .boston-filter-strip { min-height:40px; }
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <header class="header" id="header">
      <div class="siteLogoRow" aria-label="ANY logo">
        <div class="header__inner siteHeaderInner--logo">
          <div class="header__logoCrop"><img class="header__logoImage" src="../logo.png" alt="ANY" /></div>
        </div>
      </div>
      <div class="header__inner siteHeaderInner--title boston-header-row">
        <h1 class="header__title">BOSTON OPEN</h1>
        <div class="boston-social" aria-label="Page links">
          <a class="boston-social__link" href="../" aria-label="Home" title="Home">
            <svg class="boston-social__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7"/><path d="M5 9v12h14V9"/><path d="M9 21v-8h6v8"/></svg>
          </a>
          <a class="boston-social__link" href="https://www.instagram.com/any.jiujitsu/" target="_blank" rel="noopener noreferrer" aria-label="Instagram" title="Instagram">
            <svg class="boston-social__icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="2.5" width="19" height="19" rx="5" ry="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="0.5"/></svg>
          </a>
        </div>
      </div>
      <div class="stickyFilters">
        <nav class="filters" aria-label="Boston Open page toolbar">
          <div class="filters__inner boston-filter-strip">
            <div class="boston-controls">
              <div class="boston-picker" id="competitionPicker">
                <button class="boston-pill" id="competitionToggle" type="button" aria-expanded="false" aria-controls="competitionMenu"><span class="boston-pill-label" id="competitionLabel">COMPETITIONS · LOADING</span><span class="boston-dot" aria-hidden="true"></span><span aria-hidden="true">▾</span></button>
                <div class="boston-menu" id="competitionMenu" hidden>
                  <div class="boston-menu-actions"><strong>IBJJF Boston competitions</strong><button type="button" id="clearCompetitions">Clear</button></div>
                  <div id="competitionOptions">Loading competitions…</div>
                </div>
              </div>
              <form class="boston-search-form" id="athleteSearchForm">
                <div class="boston-picker boston-gym-picker" id="academyPicker">
                  <button class="boston-pill" id="academyToggle" type="button" aria-expanded="false" aria-controls="academyMenu"><span class="boston-pill-label" id="academyLabel">ACADEMIES · SELECT COMPETITIONS</span><span class="boston-dot" aria-hidden="true"></span><span aria-hidden="true">▾</span></button>
                  <div class="boston-menu boston-gym-menu" id="academyMenu" hidden>
                    <div class="boston-menu-actions"><strong>ACADEMIES IN SELECTED COMPETITIONS</strong><button type="button" id="clearAcademies">Clear</button></div>
                    <div id="academyOptions">Select a competition first.</div>
                  </div>
                </div>
                <button type="submit" class="boston-submit" id="athleteSearchButton">GO</button>
                <button type="button" class="boston-submit boston-clear" id="clearAllButton">CLEAR</button>
              </form>
            </div>
          </div>
        </nav>
      </div>
    </header>
    <main class="content boston-content" aria-label="Boston Open">
      <div class="content__inner" id="bostonOpenRoot">
        <p class="boston-status" id="bostonStatus" role="status" aria-live="polite">Loading IBJJF Boston competitions…</p>
        <section class="boston-results" id="bostonResults" aria-label="Athlete results">
          <div class="boston-results-head"><span>NAME</span><span>BRACKET</span><span>TIME</span><span>MAT</span><span>DAY</span></div>
          <div id="athleteRows"><div class="boston-empty"> </div></div>
        </section>
      </div>
    </main>
  </div>
  <script>
    // On phones, position the Academies menu inside the *visible* viewport,
    // not relative to the academy pill or the wider table/page layout.
    (() => {
      const toggle = document.getElementById('academyToggle');
      const menu = document.getElementById('academyMenu');
      if (!toggle || !menu) return;
      function positionAcademies() {
        if (window.innerWidth > 680 || menu.hidden) {
          menu.style.removeProperty('left');
          menu.style.removeProperty('right');
          menu.style.removeProperty('top');
          menu.style.removeProperty('width');
          return;
        }
        const view = window.visualViewport;
        const left = view ? view.offsetLeft : 0;
        const width = view ? view.width : window.innerWidth;
        menu.style.left = `${left + 8}px`;
        menu.style.right = 'auto';
        menu.style.width = `${Math.max(200, width - 16)}px`;
        menu.style.top = `${toggle.getBoundingClientRect().bottom + 7}px`;
      }
      toggle.addEventListener('click', () => requestAnimationFrame(positionAcademies));
      window.addEventListener('resize', positionAcademies);
      window.addEventListener('scroll', positionAcademies, {passive:true});
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', positionAcademies);
        window.visualViewport.addEventListener('scroll', positionAcademies);
      }
    })();
  </script>
  <script type="module" src="./boston-open.js?v=responsive-sort-clear-20261023"></script>
</body>
</html>
