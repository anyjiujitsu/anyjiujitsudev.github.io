
name: IBJJF competition catalog

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ibjjf-competition-catalog
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install browser scraper
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Fetch IBJJF competitions
        run: python admin/scripts/refresh_ibjjf_competitions.py

      - name: Publish competition catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin/matches-competitions.json

          if ! git diff --cached --quiet; then
            git commit -m 'Refresh IBJJF competition catalog'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
