<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ANY N.E. GRAPPLING | SHOP</title>

  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/layout.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="stylesheet" href="./shop.css" />
  <script type="module" src="./shop.js"></script>
</head>
<body>
  <div class="app shopPage" id="app">
    <header class="header" id="header">
      <div aria-label="ANY logo" class="siteLogoRow" data-customization-logo-label>
        <div class="header__inner siteHeaderInner--logo">
          <div class="header__logoCrop">
            <img class="header__logoImage" src="../logo.png" alt="ANY" data-customization-logo-alt />
          </div>
        </div>
      </div>

      <div class="header__inner siteHeaderInner--title">
        <h1 class="header__title" aria-label="Current view">SHOP</h1>
        <div class="header__countWrap" aria-live="polite">
          <span id="shopCount" class="status header__count"></span>
        </div>
      </div>

      <div class="shopHeaderRule" aria-hidden="true"></div>
    </header>

    <main class="shopContent" aria-label="Shop products">
      <p class="shopIntro">Limited ANY N.E. drops sold at direct cost.</p>
      <div id="shopState" class="shopState">Loading shop…</div>
      <section id="shopList" class="shopList" aria-live="polite"></section>
    </main>
  </div>
</body>
</html>
