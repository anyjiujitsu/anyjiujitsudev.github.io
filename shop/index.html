<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ANY N.E. GRAPPLING | SHOP</title>

  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/layout.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />

  <style>
    /* section: shop page | purpose: standalone shop layout matching main site theme */
    .shopPage{
      min-height: 100svh;
      background: var(--bg);
    }

    .shopHeaderSpacer{
      height: 12px;
      background: var(--green);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.12);
    }

    .shopContent{
      max-width: var(--maxW);
      margin: 0 auto;
      padding: 18px var(--pagePad) 64px;
    }

    .shopIntro{
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .shopList{
      display: grid;
      gap: 22px;
    }

    .shopItem{
      background: var(--row);
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: var(--radius);
      box-shadow: 0 6px 18px var(--shadow);
      overflow: hidden;
    }

    .shopItem__media{
      background:
        linear-gradient(135deg, rgba(232, 221, 198, 0.90), rgba(226, 228, 228, 0.95));
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
      min-height: 360px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
    }

    .shopItem__placeholder{
      width: min(100%, 420px);
      aspect-ratio: 1 / 1;
      border: 2px dashed rgba(35, 76, 49, 0.35);
      border-radius: calc(var(--radius) + 6px);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: rgba(35, 76, 49, 0.70);
      font-family: 'Fixture', Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .shopItem__body{
      padding: 18px;
    }

    .shopItem__name{
      margin: 0;
      font-family: 'Fixture', Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
      color: var(--green);
      font-size: 32px;
      font-weight: 900;
      line-height: 0.95;
      letter-spacing: -0.02em;
      text-transform: uppercase;
    }

    .shopItem__meta{
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .shopItem__price{
      margin: 14px 0 0;
      color: var(--text);
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 0.02em;
    }

    .shopItem__actions{
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .shopButton{
      appearance: none;
      border: 0;
      border-radius: var(--radiusPill);
      padding: 11px 18px;
      background: rgba(0, 0, 0, 0.18);
      color: rgba(0, 0, 0, 0.42);
      font-family: 'Fixture', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: not-allowed;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.08);
    }

    .shopStatus{
      color: var(--green);
      font-family: 'Fixture', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.10em;
      text-transform: uppercase;
    }

    .shopFooterNote{
      margin: 24px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
      text-align: center;
    }

    @media (max-width: 640px){
      .shopContent{
        padding-top: 12px;
      }

      .shopIntro{
        font-size: 12px;
        padding: 0 6px;
      }

      .shopList{
        gap: 14px;
      }

      .shopItem__media{
        min-height: 280px;
        padding: 18px;
      }

      .shopItem__placeholder{
        font-size: 16px;
      }

      .shopItem__body{
        padding: 14px;
      }

      .shopItem__name{
        font-size: 24px;
      }

      .shopItem__meta{
        font-size: 12px;
      }

      .shopItem__price{
        font-size: 15px;
      }

      .shopButton,
      .shopStatus{
        font-size: 11px;
      }
    }
  </style>
</head>

<body>
  <div class="app shopPage" id="app">
    <header class="header" id="header">
      <div aria-label="ANY logo" class="siteLogoRow" data-customization-logo-label>
        <div class="header__inner siteHeaderInner--logo">
          <div class="header__logoCrop">
            <img class="header__logoImage" src="../logo.png" alt="ANY" data-customization-logo-alt />
          </div>
        </div>
      </div>

      <div class="header__inner siteHeaderInner--title">
        <h1 class="header__title" aria-label="Current view">SHOP</h1>

        <div class="headerSocial" aria-label="Header social links">
          <a class="headerSocial__link" data-customization-link="github" href="#" target="_blank" rel="noopener" aria-label="GitHub repository">
            <svg class="headerSocial__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M9 19c-5 1.5-5-2.5-7-3"></path>
              <path d="M15 22v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 19 4.77 5.07 5.07 0 0 0 18.91 1S17.73.65 15 2.48a13.38 13.38 0 0 0-7 0C5.27.65 4.09 1 4.09 1A5.07 5.07 0 0 0 4 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 8 18.13V22"></path>
            </svg>
          </a>

          <a class="headerSocial__link" data-customization-link="instagram" href="#" target="_blank" rel="noopener" aria-label="Instagram profile">
            <svg class="headerSocial__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <rect x="2.5" y="2.5" width="19" height="19" rx="5" ry="5"></rect>
              <path d="M16 11.37a4 4 0 1 1-1.1-2.75A4 4 0 0 1 16 11.37z"></path>
              <circle cx="17.5" cy="6.5" r="0.5"></circle>
            </svg>
          </a>

          <a class="headerSocial__link" data-customization-link="contact" href="#" target="_blank" rel="noopener" aria-label="Instagram DM">
            <svg class="headerSocial__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </a>
        </div>
      </div>

      <div class="shopHeaderSpacer" aria-hidden="true"></div>
    </header>

    <main class="shopContent" aria-label="Shop items">
      <p class="shopIntro">Limited ANY drops will live here. Items are shown one at a time as you scroll.</p>

      <section class="shopList">
        <!--
          DUPLICATE THIS ARTICLE FOR EACH NEW SHOP ITEM.
          Replace the placeholder block with an <img> when product photos are ready, for example:
          <img src="item-name.png" alt="Product name" />
        -->
        <article class="shopItem">
          <div class="shopItem__media">
            <div class="shopItem__placeholder">Item Image</div>
          </div>
          <div class="shopItem__body">
            <h2 class="shopItem__name">ANY Shop Item</h2>
            <p class="shopItem__meta">Product details will go here once the first item is ready.</p>
            <p class="shopItem__price">$—</p>
            <div class="shopItem__actions">
              <button class="shopButton" type="button" disabled aria-disabled="true">Buy Now</button>
              <span class="shopStatus">Sold Out</span>
            </div>
          </div>
        </article>
      </section>

      <p class="shopFooterNote">More items can be added below this first card as future drops are ready.</p>
    </main>
  </div>

  <script type="module">
    import { applyCustomization, CUSTOMIZATION } from '../customization.js';

    applyCustomization(CUSTOMIZATION);
    document.title = `${CUSTOMIZATION.siteHeaderName || 'ANY N.E. GRAPPLING'} | SHOP`;
  </script>
</body>
</html>
